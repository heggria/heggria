<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">Heggria — Work that outlives the chat. Workflow schematic.</title><desc id="desc">Original illustration by Heggria. Workflow animation is a schematic, not a live run.</desc>
<defs>
<radialGradient id="glow"><stop stop-color="#bfa3ff" stop-opacity=".19"/><stop offset="1" stop-color="#bfa3ff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#b0a8c2" opacity=".2"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#f5f1ff}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{fill:#b0a8c2}
.flow{stroke-dasharray:7 17;animation:flow 4s linear infinite}
.signal{animation:signal 14s ease-in-out infinite}
.flow.signal{animation:flow 4s linear infinite,signal 14s ease-in-out infinite}
.gate{animation:gate 14s ease-in-out infinite}
.replay{stroke-dasharray:6 12;animation:replay 14s linear infinite}
@keyframes flow{to{stroke-dashoffset:-96}}
@keyframes signal{0%,5%{opacity:.2}18%,37%{opacity:1}48%,100%{opacity:.2}}
@keyframes gate{0%,30%{opacity:.3}38%,57%{opacity:1}70%,100%{opacity:.3}}
@keyframes replay{0%,57%{opacity:0;stroke-dashoffset:0}63%{opacity:1}92%{opacity:1;stroke-dashoffset:120}100%{opacity:0;stroke-dashoffset:150}}
@media(prefers-reduced-motion:reduce){.flow,.signal,.gate,.replay{animation:none!important}.replay{opacity:.5}}
</style>
<rect width="600" height="720" rx="24" fill="#111119"/>
<rect x="20" y="235" width="560" height="390" fill="url(#dots)"/><text x="32" y="44" font-size="15" class="mono muted" letter-spacing="2">H / PERSONAL LAB</text><text x="28" y="133" font-size="81" class="" font-weight="750" letter-spacing="-4">HEGGRIA</text><text x="32" y="187" font-size="26" class="" letter-spacing="-.8">Work that outlives the chat.</text><text x="32" y="220" font-size="18" class="muted" >Agent systems. Thoughtful tools.</text><g transform="translate(46 253) scale(1.08)"><circle cx="280" cy="160" r="218" fill="url(#glow)"/><g fill="none" stroke="#393345"><circle cx="280" cy="160" r="155"/><circle cx="280" cy="160" r="190" stroke-dasharray="2 12"/></g><path d="M38 160H92Q108 160 108 144V98Q108 82 124 82H170" fill="none" stroke="#393345" stroke-width="2"/><path class="flow signal" d="M38 160H92Q108 160 108 144V98Q108 82 124 82H170" fill="none" stroke="#bfa3ff" stroke-width="2"/><path d="M38 160H92Q108 160 108 176V222Q108 238 124 238H170" fill="none" stroke="#393345" stroke-width="2"/><path class="flow signal" d="M38 160H92Q108 160 108 176V222Q108 238 124 238H170" fill="none" stroke="#bfa3ff" stroke-width="2"/><path d="M220 82H260Q276 82 276 98V144Q276 160 292 160H322" fill="none" stroke="#393345" stroke-width="2"/><path class="flow signal" d="M220 82H260Q276 82 276 98V144Q276 160 292 160H322" fill="none" stroke="#bfa3ff" stroke-width="2"/><path d="M220 238H260Q276 238 276 222V176Q276 160 292 160H322" fill="none" stroke="#393345" stroke-width="2"/><path class="flow signal" d="M220 238H260Q276 238 276 222V176Q276 160 292 160H322" fill="none" stroke="#bfa3ff" stroke-width="2"/><path d="M366 160H432" stroke="#393345" stroke-width="2" stroke-dasharray="4 6"/><path d="M344 188V284Q344 306 322 306H60Q38 306 38 284V191" fill="none" stroke="#393345" stroke-width="1.5"/><path class="replay" d="M344 188V284Q344 306 322 306H60Q38 306 38 284V191" fill="none" stroke="#e7a5c6" stroke-width="2.5"/><rect x="15" y="137" width="46" height="46" rx="13" fill="#191923" stroke="#bfa3ff" stroke-width="1.5"/><circle class="signal" cx="38" cy="160" r="6" fill="#bfa3ff"/><text x="38" y="122" font-size="13" class="mono muted" text-anchor="middle">PLAN</text><rect x="172" y="59" width="46" height="46" rx="13" fill="#191923" stroke="#bfa3ff" stroke-width="1.5"/><circle class="signal" cx="195" cy="82" r="6" fill="#bfa3ff"/><text x="195" y="44" font-size="13" class="mono muted" text-anchor="middle">BUILD</text><rect x="172" y="215" width="46" height="46" rx="13" fill="#191923" stroke="#bfa3ff" stroke-width="1.5"/><circle class="signal" cx="195" cy="238" r="6" fill="#bfa3ff"/><text x="195" y="200" font-size="13" class="mono muted" text-anchor="middle">CHECK</text><rect x="326" y="142" width="36" height="36" rx="6" transform="rotate(45 344 160)" fill="#191923" stroke="#f0c58d" stroke-width="2"/><path class="gate" d="M339 151V169M349 151V169" stroke="#f0c58d" stroke-width="3"/><text x="344" y="117" font-size="13" class="mono muted" text-anchor="middle">VERIFY</text><circle cx="446" cy="160" r="14" fill="#191923" stroke="#393345" stroke-width="2"/><path d="M440 160H452" stroke="#b0a8c2" stroke-width="2"/><text x="446" y="201" font-size="12" class="mono muted" text-anchor="middle">HELD</text><text x="188" y="335" font-size="12" class="mono muted" text-anchor="middle">↶  REPLAY THE TRACE</text></g><path d="M32 653H568" stroke="#393345"/><text x="32" y="686" font-size="13" class="mono muted" letter-spacing="1">WORKFLOW STUDY 001</text><text x="568" y="686" font-size="12" class="mono muted" text-anchor="end">ANIMATED SCHEMATIC</text>
</svg>
